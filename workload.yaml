apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wasm-deploy
  namespace: application
spec:
  parentRefs:
    - name: shared
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /wasm
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: wasm-deploy.internal   # must equal config.host above
            path:
              type: ReplacePrefixMatch
      backendRefs:
        - name: wasm-deploy
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wasm-deploy
  namespace: application
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: wasm-deploy
  namespace: application
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: wasm-deploy
      components:
        - name: wasm-deploy
          image: ghcr.io/jamesstocktonj1/wasm-deploy/function:0.1.0 # Function Version
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: wasm-deploy.internal