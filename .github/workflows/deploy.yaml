name: Deploy Function
run-name: Deploy Function ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Publish version
        required: true

permissions:
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      # Setup Tools
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:cicd
      - name: Setup ArgoCD CLI
        run: |
          curl -fsSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 0755 argocd /usr/local/bin/argocd
          argocd version --client

      # Deploy Function
      - name: Deploy Function
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_OPTS: --grpc-web --insecure
          VERSION: ${{ inputs.version }}
        run: |
          # --validate=false: Argo's repo connectivity test can't pass anonymously on ghcr.io
          argocd app set wasm-deploy --revision "$VERSION" --validate=false